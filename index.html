<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulateur d'examen AZ-104</title>
<meta name="description" content="Simulateur gratuit et open source de l'examen Microsoft Azure Administrator (AZ-104), en français et en anglais, avec les formats de questions de l'examen réel. Free, open-source AZ-104 exam simulator in English and French.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/i18n.js"></script>
<script src="questions/manifest.js"></script>
<script>
  /* Choix de la langue : paramètre ?lang=, sinon choix mémorisé, sinon langue du navigateur. */
  (function () {
    var saved = null, param = new URLSearchParams(location.search).get("lang");
    try { saved = localStorage.getItem("az104-lang"); } catch (e) {}
    var nav = (navigator.language || "fr").slice(0, 2).toLowerCase();
    var lang = param || saved || (nav === "fr" ? "fr" : "en");
    if (window.AZ_LANGS.indexOf(lang) < 0) lang = "fr";
    if (param) { try { localStorage.setItem("az104-lang", lang); } catch (e) {} }
    window.AZ_LANG = lang;
    document.documentElement.lang = lang;
    window.AZ = { questions: [], series: [], cases: [], extras: {} };
    window.tbl = function (head, rows) {
      return '<div class="tw"><table class="tbl"><tr>' + head.map(function (h) { return "<th>" + h + "</th>"; }).join("") + "</tr>" +
        rows.map(function (r) { return "<tr>" + r.map(function (c) { return "<td>" + c + "</td>"; }).join("") + "</tr>"; }).join("") + "</table></div>";
    };
    window.AZ_FILES.forEach(function (f) { document.write('<script src="questions/' + lang + "/" + f + '"><\/script>'); });
  })();
</script>
</head>
<body>
<div class="app">
  <header class="head" id="head" hidden>
    <h1 class="qtitle" id="qtitle">Question 1</h1>
    <div class="prog" id="prog">
      <div class="lbl"><span id="progTitle"></span> <button class="tog" id="togP" type="button" aria-pressed="true"></button></div>
      <div class="row" id="progRow"><div class="sec"><small id="progLbl"></small><div class="bar"><i id="progBar" style="width:0%"></i></div></div><div class="sec"><small id="revTitle"></small><div class="revbar" id="revBar"></div></div></div>
    </div>
    <div class="tim" id="tim">
      <div class="lbl"><span id="timTitle"></span> <button class="tog" id="togT" type="button" aria-pressed="true"></button></div>
      <b id="timer">--:--:--</b>
    </div>
  </header>
  <main id="main"></main>
  <footer class="foot" id="foot" hidden></footer>
</div>
<div class="modal" id="modal" hidden><div class="panel" id="modalBox"></div></div>
<script src="assets/app.js"></script>
</body>
</html>
